<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo app</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..350,0..1,-50..200"/>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="wrap">
        <div class="sidebar">
            <span class="sidebar-label">Overview</span>
            <div class="cat active" id="filter-all">
                <span class="material-symbols-outlined">grid_view</span>
                All
                <span class="count" id="count-all"></span>
            </div>
            <div class="cat" id="filter-today">
                <span class="material-symbols-outlined">schedule</span>
                Today
                <span class="count" id="count-today"></span>
            </div>
            <div class="cat" id="filter-done">
                <span class="material-symbols-outlined">check</span>
                Done
                <span class="count" id="count-done"></span>
            </div>
            <span class="sidebar-label">Labels</span>
            <div class="cat" id="filter-design">
                <span class="dot-design"></span>
                Design
                <span class="count" id="count-design"></span>
            </div>
            <div class="cat" id="filter-dev">
                <span class="dot-dev"></span>
                Dev
                <span class="count" id="count-dev"></span>
            </div>
            <div class="cat" id="filter-review">
                <span class="dot-review"></span>
                Review 
                <span class="count" id="count-review"></span>
            </div>
        </div>
        <div class="main">
            <div class="header">
                <h2 id="view-title">All tasks</h2>
                <button class="add-btn" id="add-btn">+ Add task</button>
            </div>

            <div class="task-list" id="task-list">

                <div class="section" id="section-today">
                    <div class="section-title">Today</div>
                    <div class="tasks" id="tasks-today"></div>
                </div>

                <div class="section" id="section-later">
                    <div class="section-title">Later</div>
                    <div class="tasks" id="tasks-later"></div>
                </div>

                <div class="section" id="section-done">
                    <div class="section-title">Done</div>
                    <div class="tasks" id="tasks-done"></div>
                </div>

            </div>
        </div>

    </div>
    <div class="newtask-popup" id="newtask-popup">
        <h3>New task </h3>
        <label>Task name</label>
        <input id="task-name" placeholder="e.g. Review pull request">
        <label>When</label>
        <select id="task-date">
            <option>Today</option>
            <option>Later</option>
        </select>
        <label>Priority</label>
        <select id="task-priority">
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
        </select>
        <label>Label</label>
        <select id="task-label">
            <option>Dev</option>
            <option>Design</option>
            <option>Review</option>
        </select>
        <button class="cancel-popup" id="cancel-popup">Cancel</button>
        <button class="done-popup" id="done-popup">Done</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
